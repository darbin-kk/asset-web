server {
    listen 80;
    listen [::]:80;
    server_name asset-web.ru www.asset-web.ru asset-195-209-212-148.sslip.io;
    root /var/www/asset-web;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /api/lead {
        limit_req zone=asset_lead burst=3 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
